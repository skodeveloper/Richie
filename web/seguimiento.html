<body>
<a class="sr-only" href="#main">Saltar al contenido</a>
<main id="main">
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow">Tu pedido, paso a paso</p>
    <h1>Seguimiento</h1>
    <p>Escribe tu folio (ej. LL-7KQ2M) o el teléfono con el que pediste.</p>
  </div>
</section>
<section class="section tight">
  <div class="wrap">
    <form class="track-form panel" id="track-form" novalidate>
      <div class="field" style="margin:0"><label for="t-folio">Folio</label><input id="t-folio" name="folio" placeholder="LL-XXXXX" autocomplete="off" autocapitalize="characters" maxlength="12"></div>
      <div class="field" style="margin:0"><label for="t-tel">Teléfono</label><input id="t-tel" name="telefono" type="tel" inputmode="tel" placeholder="10 dígitos" autocomplete="tel" maxlength="16"></div>
      <button class="btn" type="submit">Buscar</button>
    </form>
    <div id="track-result" aria-live="polite"></div>
    <div id="recent"></div>
  </div>
</section>
</main>
<noscript><div class="wrap"><div class="alert warn">Activa JavaScript para ver el catálogo y hacer pedidos. También puedes llamarnos al <a href="tel:+525555170726">55 5517 0726</a>.</div></div></noscript>
</body>
